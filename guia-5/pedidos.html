<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos | Panadería Santa Rosa</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
  <link rel="stylesheet" href="css/marca.css">
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-cafe">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Panadería Santa Rosa</a>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">← Guías</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="pedidos.html">Pedidos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 650px;">
    <h1 class="mb-2">Haz tu pedido</h1>
    <p class="text-body-secondary mb-4">Te confirmaremos por WhatsApp en menos de una hora.</p>

    <form action="#" novalidate class="card p-4 shadow-sm">
      <div class="mb-3">
        <label for="nombre" class="form-label fw-bold">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" required aria-describedby="error-nombre">
        <p class="text-danger fw-bold small mt-1 mb-0" id="error-nombre"></p>
      </div>

      <div class="mb-3">
        <label for="celular" class="form-label fw-bold">Celular</label>
        <input type="tel" class="form-control" id="celular" name="celular" required aria-describedby="error-celular">
        <p class="text-danger fw-bold small mt-1 mb-0" id="error-celular"></p>
      </div>

      <div class="mb-3">
        <label for="producto" class="form-label fw-bold">Producto</label>
        <select class="form-select" id="producto" name="producto" required aria-describedby="error-producto">
          <option value="">Elige un producto</option>
          <option value="Pan francés">Pan francés</option>
          <option value="Pan de yema">Pan de yema</option>
          <option value="Chancay">Chancay</option>
          <option value="Torta de chocolate">Torta de chocolate</option>
        </select>
        <p class="text-danger fw-bold small mt-1 mb-0" id="error-producto"></p>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-sm-6">
          <label for="cantidad" class="form-label fw-bold">Cantidad</label>
          <input type="number" class="form-control" id="cantidad" name="cantidad" min="1" value="1" required aria-describedby="error-cantidad">
          <p class="text-danger fw-bold small mt-1 mb-0" id="error-cantidad"></p>
        </div>
        <div class="col-sm-6">
          <label for="fecha" class="form-label fw-bold">Fecha de recojo</label>
          <input type="date" class="form-control" id="fecha" name="fecha" required aria-describedby="error-fecha">
          <p class="text-danger fw-bold small mt-1 mb-0" id="error-fecha"></p>
        </div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="consentimiento" name="consentimiento" required aria-describedby="error-consentimiento">
        <label class="form-check-label" for="consentimiento">
          Autorizo que usen mis datos solo para atender este pedido.
        </label>
        <p class="text-danger fw-bold small mt-1 mb-0" id="error-consentimiento"></p>
      </div>

      <div id="estado" class="alert alert-warning fw-bold" role="status"></div>
      <button type="submit" class="btn btn-marca btn-lg w-100">Enviar pedido</button>
    </form>
  </main>
</body>
</html>
